/* ---- CHECKOUT ---- */
function Checkout(){
  const {t,lang,items,total,order,setOrder,showToast,clear}=useApp();
  const [step,setStep]=useState(0); // 0 gate, 1 dati, 2 pagamento, 3 conferma
  const [sub,setSub]=useState(null); // cryptoQuestion / cryptoGuide / amazonQuestion / amazonGuide / confirm
  const [code,setCode]=useState('');
  const [err,setErr]=useState('');
  const s = order.shipping;
  const isPaypal = items.some(i=>i.name.startsWith('Ricarica')||i.sub&&i.sub.includes('TRASFERIMENTO')) && false;
  const setS = p => setOrder(o=>({...o,shipping:{...o.shipping,...p}}));

  if(items.length===0 && step<3) return (
    <div className="mx-auto max-w-2xl px-4 pt-10"><Back/><Card className="mt-6 text-center"><p className="mono text-sm text-zinc-300">{t('cart.empty')}</p><div className="mt-4 flex justify-center gap-2"><a href="#/cash"><Btn variant="outline">{t('nav.cash')}</Btn></a><a href="#/paypal"><Btn>{t('nav.paypal')}</Btn></a></div></Card></div>
  );

  const submitData = ()=>{
    if(isPaypal){ if(!order.paypalEmail){setErr(t('checkout.step1.enterPaypalEmail'));return;} setErr(''); setStep(2); return; }
    if(!s.address||!s.number||!s.zip||!s.city||!s.email||!s.phone||!s.courier){setErr(t('checkout.step1.fillRequired'));return;}
    setErr(''); setStep(2);
  };

  const finalTotal = order.method==='bonifico'? total*1.1 : order.method==='amazon'? total*1.2 : total;

  const confirm = ()=>{
    const c=orderId(); setCode(c);
    const msg=['🟡 NUOVO ORDINE GUSTAVOEURO','', ...items.map(i=>`• ${i.name} × ${i.qty} = ${money(i.unit*i.qty,lang)}`), '', `TOTALE: ${money(finalTotal,lang)}`, `METODO: ${order.method}`, '', 'DATI:', `${s.address} ${s.number}, ${s.zip} ${s.city} (${s.province})`, `Email: ${s.email}`, `Cell: ${s.prefix} ${s.phone}`, `Corriere: ${s.courier} ${s.locker||''}`, '', `CODICE ORDINE: ${c}`].join('\n');
    navigator.clipboard&&navigator.clipboard.writeText(msg).catch(()=>{});
    setStep(3);
  };

  const steps=['data','verify','payment','confirm'];
  return (
    <div className="mx-auto max-w-3xl px-4 pt-6">
      <div className="mb-4 flex items-center justify-between"><Back to="/menu"/><span className="mono text-[10px] tracking-[.2em] text-emerald-400 flex items-center gap-1.5"><span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse-neon"/>{t('checkout.sessionEncrypted')}</span></div>
      <div className="mb-5 flex items-center gap-2">{steps.map((st,i)=>(
        <div key={st} className="flex flex-1 items-center gap-2">
          <div className={clsx('flex h-6 w-6 items-center justify-center rounded-full mono text-[10px]', i<=step?'bg-emerald-400 text-black':'border border-line text-zinc-500')}>{i+1}</div>
          <span className={clsx('mono text-[9px] tracking-widest', i<=step?'text-emerald-400':'text-zinc-600')}>{t('checkout.stepper.'+st)}</span>
          {i<3 && <div className={clsx('h-px flex-1', i<step?'bg-emerald-400/50':'bg-line')}/>}
        </div>
      ))}</div>

      {step===0 && (
        <Card className="text-center">
          <Corner/>
          <h1 className="text-xl font-bold tracking-tight text-zinc-50">{t('checkout.gateway.title')}</h1>
          <p className="mt-2 mono text-[10px] tracking-widest text-zinc-500">{t('checkout.gateway.subtitle')}</p>
          <div className="mt-5 space-y-3">
            <Btn className="w-full" onClick={()=>setStep(1)}>{t('checkout.gateway.yes')}</Btn>
            <a href={isMobile()&&/Android/i.test(navigator.userAgent)?'https://play.google.com/store/apps/details?id=org.telegram.messenger':'https://apps.apple.com/app/telegram-messenger/id686449807'} target="_blank" rel="noreferrer"><Btn variant="outline" className="w-full">{t('checkout.gateway.download')}</Btn></a>
          </div>
        </Card>
      )}

      {step===1 && (
        <div className="space-y-4">
          <Card>
            <p className="eyebrow">{t('checkout.step1.summaryProtected')}</p>
            <div className="mt-3 space-y-2">{items.map(i=>(<div key={i.id} className="flex justify-between text-sm"><span className="text-zinc-300">{i.name} × {i.qty}</span><span className="mono text-zinc-200">{money(i.unit*i.qty,lang)}</span></div>))}</div>
            <div className="mt-3 flex justify-between border-t border-line pt-3"><span className="mono text-xs uppercase tracking-widest text-zinc-400">{t('checkout.step1.total')}</span><span className="mono text-lg text-emerald-400">{money(total,lang)}</span></div>
          </Card>
          <Card>
            <h2 className="text-lg font-bold text-zinc-50">{t('checkout.step1.titleShipping')}</h2>
            <p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step1.subtitleShipping')}</p>
            <div className="mt-4 space-y-3">
              <div><label className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step1.shippingAddress')}</label>
                <div className="mt-1 grid grid-cols-3 gap-2"><input className="ds-input col-span-2" placeholder={t('checkout.step1.street')} value={s.address} onChange={e=>setS({address:e.target.value})}/><input className="ds-input" placeholder={t('checkout.step1.number')} value={s.number} onChange={e=>setS({number:e.target.value})}/></div>
              </div>
              <div className="grid grid-cols-3 gap-2"><input className="ds-input" placeholder={t('checkout.step1.zip')} value={s.zip} onChange={e=>setS({zip:e.target.value})}/><input className="ds-input col-span-2" placeholder={t('checkout.step1.city')} value={s.city} onChange={e=>setS({city:e.target.value})}/></div>
              <div><label className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step1.contacts')}</label>
                <div className="mt-1 space-y-2"><input className="ds-input" placeholder={t('checkout.step1.email')} value={s.email} onChange={e=>setS({email:e.target.value})}/>
                <div className="flex gap-2"><select className="ds-input w-24" value={s.prefix} onChange={e=>setS({prefix:e.target.value})}>{PREFIXES.map(p=><option key={p}>{p}</option>)}</select><input className="ds-input" placeholder={t('checkout.step1.phone')} value={s.phone} onChange={e=>setS({phone:e.target.value})}/></div></div>
              </div>
              <div><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step1.selectCourier')}</p>
                <div className="mt-2 grid gap-2 sm:grid-cols-2">{SHIPPERS.map(c=>(<button key={c} onClick={()=>setS({courier:c})} className={clsx('rounded-lg border p-3 text-left transition-all', s.courier===c?'border-emerald-400/70 bg-emerald-400/10':'border-line hover:border-zinc-500')}><p className="mono text-xs text-zinc-100">{c}</p><p className="mono text-[9px] text-zinc-500">{t('checkout.shipping.'+({'POSTE ITALIANE':'poste','BRT':'brt','GLS':'gls','DHL':'dhl','LOCKER INPOST':'locker'})[c]+'Sub')} · {t('checkout.shipping.'+({'POSTE ITALIANE':'poste','BRT':'brt','GLS':'gls','DHL':'dhl','LOCKER INPOST':'locker'})[c]+'Time')}</p></button>))}</div>
                {s.courier==='LOCKER INPOST' && <input className="ds-input mt-2" placeholder={t('checkout.step1.lockerPlaceholder')} value={s.locker} onChange={e=>setS({locker:e.target.value})}/>}
              </div>
            </div>
            {err && <p className="mt-3 mono text-xs text-red-400">{err}</p>}
            <Btn className="mt-4 w-full" onClick={submitData}>{t('checkout.step1.continuePayment')}</Btn>
          </Card>
        </div>
      )}

      {step===2 && (
        <div className="space-y-4">
          <Card>
            <h2 className="text-lg font-bold text-zinc-50">{t('checkout.step2.title')}</h2>
            <p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step2.subtitle')}</p>
            <div className="mt-4 space-y-3">
              <button onClick={()=>{setOrder(o=>({...o,method:'crypto'}));setSub('cryptoQuestion');}} className={clsx('w-full rounded-xl border p-4 text-left transition-all', order.method==='crypto'?'border-emerald-400/70 bg-emerald-400/10 ds-glow':'border-line hover:border-zinc-500')}>
                <div className="flex items-center justify-between"><span className="mono text-sm text-zinc-100">{t('checkout.step2.cryptoLabel')}</span><span className="ds-badge">{t('checkout.step2.cryptoNoSurcharge')}</span></div>
                <p className="mono mt-1 text-[10px] text-zinc-500">{t('checkout.step2.cryptoSub')}</p>
                <p className="mono mt-1 text-[9px] text-emerald-400">{t('checkout.step2.cryptoBadge')}</p>
              </button>
              <button onClick={()=>{setOrder(o=>({...o,method:'bonifico'}));setSub('bonifico');}} className={clsx('w-full rounded-xl border p-4 text-left transition-all', order.method==='bonifico'?'border-emerald-400/70 bg-emerald-400/10':'border-line hover:border-zinc-500')}>
                <div className="flex items-center justify-between"><span className="mono text-sm text-zinc-100">{t('checkout.step2.bonificoLabel')}</span><span className="ds-badge">{t('checkout.step2.bonificoSurcharge')}</span></div>
                <p className="mono mt-1 text-[10px] text-zinc-500">{t('checkout.step2.bonificoSub')}</p>
              </button>
              <button onClick={()=>{setOrder(o=>({...o,method:'amazon'}));setSub('amazonQuestion');}} className={clsx('w-full rounded-xl border p-4 text-left transition-all', order.method==='amazon'?'border-emerald-400/70 bg-emerald-400/10':'border-line hover:border-zinc-500')}>
                <div className="flex items-center justify-between"><span className="mono text-sm text-zinc-100">{t('checkout.step2.amazonLabel')}</span><span className="ds-badge">{t('checkout.step2.amazonSurcharge')}</span></div>
                <p className="mono mt-1 text-[10px] text-zinc-500">{t('checkout.step2.amazonSub')}</p>
              </button>
            </div>
          </Card>

          {sub==='cryptoQuestion' && (
            <Card><h3 className="font-bold text-zinc-50">{t('checkout.cryptoQuestion.title')}</h3><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.cryptoQuestion.subtitle')}</p>
              <div className="mt-3 flex gap-2"><Btn className="flex-1" onClick={()=>setSub('confirm')}>{t('checkout.cryptoQuestion.yes')}</Btn><Btn variant="outline" className="flex-1" onClick={()=>setSub('cryptoGuide')}>{t('checkout.cryptoQuestion.no')}</Btn></div></Card>

          {sub==='cryptoGuide' && (

          {sub==='amazonQuestion' && (
            <Card><h3 className="font-bold text-zinc-50">{t('checkout.amazonQuestion.title')}</h3><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.amazonQuestion.subtitle')}</p>

                <div className="mt-3">
                  <p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.confirm.selectNetwork')}</p>
                  <div className="mt-2 flex gap-2">{['USDT','BTC','LTC'].map(n=>(<button key={n} onClick={()=>setOrder(o=>({...o,coin:n}))} className={clsx('flex-1 rounded-lg border p-3 mono text-xs',order.coin===n?'border-emerald-400/70 bg-emerald-400/10 text-emerald-400':'border-line text-zinc-300')}>{n}</button>))}</div>
                  {order.coin && <div className="mt-3 rounded-lg border border-line bg-black/40 p-3"><p className="mono text-[9px] tracking-widest text-zinc-500">{t('checkout.confirm.amountToSend')}</p><p className="mono break-all text-xs text-emerald-400">{WALLETS[order.coin]}</p><button onClick={async()=>{await copyText(WALLETS[order.coin]);showToast(t('common.copied'));}} className="mono mt-2 text-[10px] uppercase tracking-widest text-zinc-400 hover:text-emerald-400">{t('common.copy')}</button></div>}
                </div>
              )}
              {order.method==='amazon' && (
                <div className="mt-3"><p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.confirm.amazonCodeLabel')}</p><input className="ds-input mt-2" placeholder="XXXX-XXXX-XXXX-XXX" onChange={e=>setOrder(o=>({...o,vouchers:[e.target.value.toUpperCase()]}))}/></div>
              )}
              <div className="mt-4 space-y-1 border-t border-line pt-3">
                <div className="flex justify-between text-sm"><span className="text-zinc-400">{t('checkout.confirm.subtotal')}</span><span className="mono text-zinc-200">{money(total,lang)}</span></div>
                {order.method==='bonifico' && <div className="flex justify-between text-sm"><span className="text-zinc-400">{t('checkout.confirm.bankFee')}</span><span className="mono text-zinc-200">+{money(total*0.1,lang)}</span></div>}
                {order.method==='amazon' && <div className="flex justify-between text-sm"><span className="text-zinc-400">{t('checkout.confirm.voucherSurcharge')}</span><span className="mono text-zinc-200">+{money(total*0.2,lang)}</span></div>}
                <div className="flex justify-between pt-2"><span className="mono text-xs uppercase tracking-widest text-zinc-400">{t('checkout.confirm.totalToPay')}</span><span className="mono text-lg font-bold text-emerald-400">{money(finalTotal,lang)}</span></div>
              </div>
              <Btn className="mt-4 w-full" onClick={confirm}>{t('checkout.confirm.confirmOrder',{method:(order.method||'').toUpperCase()})}</Btn>
            </Card>
          )}
        </div>
      )}

      {step===3 && (
        <Card className="text-center">
          <Corner/>
          <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-400/15 text-emerald-400 text-2xl">✓</div>
          <h1 className="text-xl font-bold text-zinc-50">{t('checkout.step3.title')}</h1>
          <p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step3.subtitle')}</p>
          <div className="mt-4 rounded-xl border border-emerald-400/30 bg-emerald-400/5 p-4">
            <p className="mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step3.orderCode')}</p>
            <p className="mono mt-1 text-2xl font-bold tracking-widest text-emerald-400">{code}</p>
            <button onClick={async()=>{await copyText(code);showToast(t('common.copied'));}} className="mono mt-2 text-[10px] uppercase tracking-widest text-zinc-400 hover:text-emerald-400">{t('checkout.step3.copyCode')}</button>
          </div>
          <p className="mt-4 mono text-[10px] tracking-widest text-zinc-500">{t('checkout.step3.waitingBlockchain')}</p>
          <div className="mt-4 flex flex-wrap justify-center gap-2">
            <a href={TG.support} target="_blank" rel="noreferrer"><Btn>{t('checkout.step3.contactOperator')}</Btn></a>
            <Btn variant="outline" onClick={()=>{clear();nav('/menu');}}>{t('checkout.step3.backToProducts')}</Btn>
          </div>
          <p className="mt-4 text-xs text-zinc-400">{t('checkout.step3.warning')}</p>
        </Card>
      )}
    </div>
  );
}

/* ===================== APP ===================== */
function Router(){
  const p = useRoute(); const seg = p.split('/').filter(Boolean); const root = seg[0];
  if(!root) return <Boot/>;
  if(root==='lang') return <LanguageModal/>;
  let page;
  if(root==='menu') page=<Menu/>;
  else if(root==='contact') page=<Contact/>;
  else if(root==='cash') page=<Cash/>;
  else if(root==='cards') page=<Cards/>;
  else if(root==='paypal') page=<Paypal/>;
  else if(root==='quality') page=<Quality/>;
  else if(root==='feedback') page=<Feedback/>;
  else if(root==='faq') page=<Faq/>;
  else if(root==='privacy'||root==='terms'||root==='cookies') page=<Legal doc={root}/>;
  else if(root==='checkout') page=<Checkout/>;
  else page=<Menu/>;
  return (<><Header/>{page}<Footer/><CartDrawer/></>);
}

function App(){
  return (<Provider><Router/></Provider>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
